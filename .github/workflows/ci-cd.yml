name: CI/CD - Cidades ESGInteligentes

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:

  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci_admin_pwd
          APP_USER: esg_app
          APP_USER_PASSWORD: ci_app_pwd
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      DATABASE_USER: esg_app
      DATABASE_PWD: ci_app_pwd

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e empacotar
        run: mvn -B clean verify

      - name: Publicar o .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: esg-api-jar
          path: target/*.jar