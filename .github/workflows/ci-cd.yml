name: CI/CD - Cidades ESGInteligentes

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  STAGING_APP_NAME: esg-api-staging-rm565720
  PROD_APP_NAME: esg-api-prod-rm565720

jobs:

  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci_admin_pwd
          APP_USER: esg_app
          APP_USER_PASSWORD: ci_app_pwd
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
      DATABASE_USER: esg_app
      DATABASE_PWD: ci_app_pwd

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e empacotar
        run: mvn -B clean verify

      - name: Publicar o .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: esg-api-jar
          path: target/*.jar

  docker-image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e enviar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/esg-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/esg-api:${{ github.ref_name }}

  deploy-staging:
    name: Deploy em Staging
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Publicar no Azure Web App (staging)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.STAGING_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/esg-api:${{ github.sha }}

  deploy-production:
    name: Deploy em Producao
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Publicar no Azure Web App (producao)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.PROD_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/esg-api:${{ github.sha }}