    meta:
      id: req_esgregister000000000000000000001
      created: 1791250000000
      modified: 1791250000000
      isPrivate: false
      description: Cria o usuario de avaliacao (perfil ADMIN). Se o e-mail ja existir, siga para o Login.
      sortKey: -10
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "nome": "Professor Avaliador",
          "email": "professor.avaliacao@esg.com",
          "senha": "Avaliacao2026",
          "role": "ADMIN"
        }
    headers:
    - name: Content-Type
      value: application/json
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
